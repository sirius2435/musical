services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: stage_stories
      POSTGRES_USER: ${DB_USER:-db}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - archive_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d stage_stories"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  archive_database:
